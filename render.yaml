services:
  - type: web
    name: taleforge-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /api/docs/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_REQUIRE
        value: "true"
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: RUN_SEED_ON_DEPLOY
        value: "false"
      - key: ENABLE_DEMO_LOGIN_USERS
        value: "false"
      - key: ENABLE_GOOGLE_TRANSLATE_PROXY
        value: "true"
      - key: API_PAGE_SIZE
        value: "20"
      - key: THROTTLE_ANON
        value: 100/hour
      - key: THROTTLE_USER
        value: 600/hour
      - key: THROTTLE_AUTH
        value: 30/hour
      - key: THROTTLE_TRANSLATION
        value: 60/hour
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

  - type: web
    name: taleforge-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
